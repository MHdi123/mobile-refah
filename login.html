<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فرم ثبت‌نام</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card p-4 shadow">
              <h4 class="text-center mb-4">فرم ثبت‌نام</h4>
              <form>
                <div class="form-group">
                  <input type="text" id="phone" class="form-control" placeholder=" " required>
                  <label for="phone">شماره تماس</label>
                  <div id="phone-error" class="text-danger small ps-2" style="display: none;">لطفاً شماره تماس معتبر وارد کنید.</div>
                </div>
    
                <div class="form-group">
                  <input type="email" id="email" class="form-control" placeholder=" " required>
                  <label for="email">ایمیل</label>
                </div>
    
                <div class="form-group">
                  <input type="password" id="password" class="form-control" placeholder=" " required>
                  <label for="password">رمز عبور</label>
                                  </div>
                  <div class="rules mt-2" id="password-rules">
                    <span id="length" class="invalid">حداقل 8 کاراکتر</span>
                    <span id="uppercase" class="invalid">حداقل یک حرف بزرگ انگلیسی</span>
                    <span id="lowercase" class="invalid">حداقل یک حرف کوچک انگلیسی</span>
                  </div>

    
                <div class="form-group">
                  <input type="password" id="confirm" class="form-control" placeholder=" " required>
                  <label for="confirm">تکرار رمز عبور</label>
                </div>
    
                <div class="form-group">
                  <input type="date" id="birthdate" class="form-control" placeholder=" " required>
                  <label for="birthdate">تاریخ تولد</label>
                </div>
    
                <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
                <div class="text-center mt-3">
                  <small>قبلاً ثبت‌ نام کرده‌اید؟ <a href="login1.html" class="text-primary fw-bold text-decoration-none">ورود</a></small>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

  <!-- Bootstrap + اعتبارسنجی رمز -->
  <script>
    const passwordInput = document.getElementById("password");
    const lengthRule = document.getElementById("length");
    const uppercaseRule = document.getElementById("uppercase");
    const lowercaseRule = document.getElementById("lowercase");
    const rulesBox = document.getElementById("password-rules");
  
    // ابتدا قوانین مخفی باشند
    rulesBox.style.display = "none";
  
    passwordInput.addEventListener("blur", function () {
      const value = passwordInput.value;
      rulesBox.style.display = "block"; // بعد از خارج شدن از فیلد، قوانین نمایش داده می‌شوند
  
      // قانون 1: حداقل 8 کاراکتر
      if (value.length >= 8) {
        lengthRule.classList.remove("invalid");
        lengthRule.classList.add("valid");
      } else {
        lengthRule.classList.add("invalid");
        lengthRule.classList.remove("valid");
      }
  
      // قانون 2: حداقل یک حرف بزرگ انگلیسی
      if (/[A-Z]/.test(value)) {
        uppercaseRule.classList.remove("invalid");
        uppercaseRule.classList.add("valid");
      } else {
        uppercaseRule.classList.add("invalid");
        uppercaseRule.classList.remove("valid");
      }
  
      // قانون 3: حداقل یک حرف کوچک انگلیسی
      if (/[a-z]/.test(value)) {
        lowercaseRule.classList.remove("invalid");
        lowercaseRule.classList.add("valid");
      } else {
        lowercaseRule.classList.add("invalid");
        lowercaseRule.classList.remove("valid");
      }
    });
      const phoneInput = document.getElementById("phone");
  const phoneError = document.getElementById("phone-error");
  const rules = {
    length: document.getElementById("rule-length"),
    uppercase: document.getElementById("rule-uppercase"),
    lowercase: document.getElementById("rule-lowercase")
  };

  // هنگام ورود به هر فیلد
  phoneInput.addEventListener("focus", () => {
    phoneError.style.display = phoneInput.value.length < 8 ? "block" : "none";
    document.getElementById("password-rules").style.display = "none";
  });

  passwordInput.addEventListener("focus", () => {
    phoneError.style.display = "none";
    document.getElementById("password-rules").style.display = "block";
  });

  // بررسی خطای شماره تماس
  phoneInput.addEventListener("blur", () => {
    if (phoneInput.value.length < 8) {
      phoneError.style.display = "block";
    } else {
      phoneError.style.display = "none";
    }
  });

  // بررسی رمز عبور به صورت زنده
  passwordInput.addEventListener("input", () => {
    const value = passwordInput.value;
    rules.length.style.display = value.length >= 8 ? "none" : "list-item";
    rules.uppercase.style.display = /[A-Z]/.test(value) ? "none" : "list-item";
    rules.lowercase.style.display = /[a-z]/.test(value) ? "none" : "list-item";
  });
  
  </script>
  
</body>
</html>
